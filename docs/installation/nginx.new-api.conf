# 宝塔 New API 反向代理配置
#
# 本配置按以下现有路由设计：
#   /ds             -> 127.0.0.1:9000（保留你的数据服务）
#   /v1、/v1beta、/pg、/mj、/suno -> New API 127.0.0.1:3000
#   /xxx/mj         -> New API 127.0.0.1:3000
#   其他路径        -> New API 网页/API 127.0.0.1:3000
#
# 宝塔使用说明：
# 1. 如果站点配置文件已经由宝塔生成 server 块，请合并对应内容，不要重复创建相同 server。
# 2. 当前项目默认监听 3000；Docker 建议使用 127.0.0.1:3000:3000，避免绕过 Nginx 访问。
# 3. HTTPS 环境建议设置 SESSION_COOKIE_SECURE=true，并将 SESSION_COOKIE_TRUSTED_URL
#    设置为 https://nal.lhpac.top（多个域名用英文逗号分隔）。

upstream newapi_local {
    server 127.0.0.1:3000 max_fails=3 fail_timeout=30s;
    keepalive 64;
}

server {
    listen 80;
    listen [::]:80;
    server_name nal.lhpac.top nal.lingsh.top nalcf.lingsh.top;

    root /www/wwwroot/nal.lhpac.top;
    include /www/server/panel/vhost/nginx/well-known/nal.lhpac.top.conf;

    location / {
        return 301 https://$host$request_uri;
    }

    access_log /www/wwwlogs/nal.lhpac.top.log;
    error_log /www/wwwlogs/nal.lhpac.top.error.log;
}

server {
    # 兼容宝塔常见的 Nginx 版本；新版本也可改为 listen 443 ssl; + http2 on;
    listen 443 ssl http2 reuseport;
    listen [::]:443 ssl http2 reuseport;
    server_name nal.lhpac.top nal.lingsh.top nalcf.lingsh.top;

    root /www/wwwroot/nal.lhpac.top;
    underscores_in_headers on;

    include /www/server/panel/vhost/nginx/extension/nal.lhpac.top/*.conf;
    include /www/server/panel/vhost/nginx/well-known/nal.lhpac.top.conf;

    ssl_certificate /www/server/panel/vhost/cert/nal.lhpac.top/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/nal.lhpac.top/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL_NAL:50m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    error_page 497 https://$host$request_uri;

    # 与项目 common/init.go 的 MaxRequestBodyMB 默认值 128 对齐。
    client_max_body_size 128m;
    client_body_buffer_size 128k;
    client_body_timeout 600s;

    # 普通 HTTP 请求使用空 Connection 头以保留 upstream keepalive；
    # WebSocket location 会单独覆盖为 upgrade。
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header REMOTE-HOST $remote_addr;
    proxy_set_header Connection "";
    proxy_socket_keepalive on;
    proxy_connect_timeout 60s;
    proxy_send_timeout 1200s;
    proxy_read_timeout 1200s;
    proxy_redirect off;

    location ^~ /.well-known/ {
        allow all;
    }

    # 阻止敏感文件被下载；.env、.git 等不应通过网站暴露。
    location ~* (^|/)(\.user\.ini|\.htaccess|\.env|\.git|composer\.(json|lock)|package(-lock)?\.json|\.sql(\.gz)?|Dockerfile|\.DS_Store|README\.md)$ {
        return 404;
    }

    location ~* ^/\.well-known/.*\.(php|jsp|py|js|sql|bak)$ {
        return 403;
    }

    # 保留现有 /ds 到 9000 服务的路径重写。
    location ~ ^/ds(?:/|$) {
        rewrite ^/ds/?(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:9000;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        proxy_next_upstream off;
    }

    # OpenAI Realtime WebSocket。
    location = /v1/realtime {
        proxy_pass http://newapi_local;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_next_upstream off;
    }

    # Relay/SSE/流式接口：关闭响应和请求缓冲，避免延迟或缓存半截响应。
    location ~ ^/(v1|v1beta|pg|mj|suno)(/|$) {
        proxy_pass http://newapi_local;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        proxy_next_upstream off;
    }

    # 兼容 /{渠道}/mj/... 形式的任务回调或接口。
    location ~ ^/[^/]+/mj(/|$) {
        proxy_pass http://newapi_local;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        proxy_next_upstream off;
    }

    # 网页、/api/* 及其他接口。关闭 upstream 重试，避免计费 POST 在故障边界被重复提交。
    location / {
        proxy_pass http://newapi_local;
        proxy_buffering on;
        proxy_buffer_size 8k;
        proxy_buffers 32 8k;
        proxy_busy_buffers_size 64k;
        proxy_max_temp_file_size 0;
        proxy_cache off;
        proxy_next_upstream off;
    }

    # 健康检查：直接访问 https://nal.lhpac.top/api/status。
    location = /api/status {
        proxy_pass http://newapi_local/api/status;
        proxy_buffering off;
        proxy_cache off;
        proxy_next_upstream off;
        add_header Cache-Control "no-store" always;
    }

    access_log /www/wwwlogs/nal.lhpac.top.log;
    error_log /www/wwwlogs/nal.lhpac.top.error.log;
}
